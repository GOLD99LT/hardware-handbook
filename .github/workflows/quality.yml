name: Quality Gate

# 分支与 PR 全量质量门禁：在线构建、manifest 一致性 + 四质检、离线单文件、learning 单测。
# 不部署；部署见 deploy-docs.yml / deploy-cloudflare.yml。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Online build (VitePress)
        run: pnpm --filter @hw/handbook docs:build

      - name: learning unit tests
        run: node packages/learning/test/learning.test.ts

      - name: Quality gate (manifest + validate + scan_math/grounds/svg_order)
        run: python run_quality.py

      - name: Generate content manifest
        run: python packages/tooling/src/freeze_manifest.py

      - name: Offline single-file build + manifest reconciliation
        run: python packages/tooling/src/build_single_html.py --manifest .generated/content-manifest.json
